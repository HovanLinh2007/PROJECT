<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://code.jquery.com">
    <title>Thanh Toán Đơn Hàng - MILO TEA</title>

    <!-- Link Font Awesome Icon từ CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Nhúng CSS dùng chung và CSS trang Thanh toán -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/pages/thanh-toan.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>
    <!-- Header và Thanh điều hướng đồng bộ 100% với Trang Chủ và Giỏ Hàng -->
    <div id="site-header"></div>

    <!-- Nội dung chính trang Thanh toán -->
    <main class="vung-chua trang-thanh-toan" style="min-height: 500px; padding: 30px 16px;">
        <h1 class="tieu-de-trang" style="text-align: center; margin-bottom: 30px; color: var(--mau-nau-dam, #4a2c11);">Xác Nhận Thanh Toán</h1>
        <div class="khung-thanh-toan">
            <div class="cot-bieu-mau">
                <h3>Thông Tin Giao Hàng</h3>
                <form id="form-thanh-toan" onsubmit="xuLyDatHang(event)">
                    <div class="nhom-input">
                        <label>Họ và tên người nhận:</label>
                        <input type="text" id="ho-ten" required placeholder="Nhập họ tên đầy đủ">
                    </div>
                    <div class="nhom-input">
                        <label>Số điện thoại:</label>
                        <input type="text" id="so-dien-thoai" required placeholder="Nhập số điện thoại (ví dụ: 0901234567)">
                    </div>
                    <div class="nhom-input">
                        <label>Địa chỉ giao hàng:</label>
                        <textarea id="dia-chi" rows="3" required placeholder="Số nhà, tên đường, phường/xã..."></textarea>
                    </div>
                    <div class="nhom-input">
                        <label>Ghi chú đơn hàng:</label>
                        <textarea id="ghi-chu" rows="2" placeholder="Ví dụ: Giao giờ hành chính, ít ngọt..."></textarea>
                    </div>
                    <div class="nhom-input">
                        <label>Phương thức thanh toán:</label>
                        <select id="phuong-thuc-tt">
                            <option value="COD">Thanh toán khi nhận hàng (COD)</option>
                            <option value="Chuyen khoan">Chuyển khoản ngân hàng</option>
                        </select>
                    </div>
                    <button type="submit" class="nut-bam nut-dat-hang-ngay">Đặt hàng ngay</button>
                </form>
            </div>

            <div class="cot-tom-tat" id="tom-tat-don-hang">
                <!-- Render bằng JS -->
            </div>
        </div>
    </main>

    <!-- Footer 4 Cột chuẩn hóa -->
    <div id="site-footer"></div>

    <!-- Nhúng Script theo đúng thứ tự -->
    <script src="./js/tien-ich/dinh-dang.js"></script>
    <script src="./js/dich-vu/luu-tru.js"></script>
    <script src="./js/chinh.js"></script>
    <script src="./js/pages/thanh-toan.js"></script>
    <script src="./js/pages/dang-nhap-dang-ky.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./components/components.js"></script>
</body>

</html>
