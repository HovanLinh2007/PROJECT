<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://code.jquery.com">
    <title>MILO TEA - Thực Đơn Sản Phẩm</title>
    <!-- Link Font Awesome Icon từ CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Nhúng các file CSS đúng chuẩn -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/pages/chi-tiet.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>
    <!-- Header va Thanh dieu huong -->
    <div id="site-header"></div>

    <main class="vung-chua trang-thuc-don">
        <h1 class="tieu-de-trang">Menu Đồ Uống</h1>

        <!-- Thanh công cụ tìm kiếm và lọc -->
        <div class="thanh-bo-loc">
            <input type="text" id="o-tim-kiem" placeholder="Tìm kiếm món trà sữa..." oninput="xuLyBoLoc()">

            <select id="loc-danh-muc" onchange="xuLyBoLoc()">
                <option value="tat-ca">Tất cả danh mục</option>
                <option value="tra-sua">Trà sữa</option>
                <option value="tra-trai-cay">Trà trái cây</option>
                <option value="tra-nguyen-chat">Trà nguyên chất</option>
                <option value="da-xay">Đá xay</option>
            </select>

            <select id="sap-xep-gia" onchange="xuLyBoLoc()">
                <option value="mac-dinh">Sắp xếp mặc định</option>
                <option value="tang-dan">Giá: Thấp đến Cao</option>
                <option value="giam-dan">Giá: Cao đến Thấp</option>
            </select>
        </div>

        <!-- Danh sách sản phẩm được Render từ JS -->
        <div class="luoi-san-pham" id="danh-sach-san-pham-thuc-don"></div>
    </main>

    <!-- Footer 4 Cột -->
    <div id="site-footer"></div>

    <!-- Khung chứa Popup Modal -->
    <div id="khung-chi-tiet-san-pham"></div>

    <!-- Nút xóa giỏ hàng nhanh -->
    <button onclick="localStorage.clear(); location.reload();"
        style="position: fixed; bottom: 10px; right: 10px; z-index: 9999; padding: 10px; background: red; color: white; border: none; border-radius: 5px; cursor: pointer;">
        🗑️ Xóa Giỏ Hàng Cũ
    </button>

    <!-- Scripts -->
    <script src="./js/tien-ich/dinh-dang.js"></script>
    <script src="./js/dich-vu/luu-tru.js"></script>
    <script src="./js/chinh.js"></script>
    <script src="./js/pages/chi-tiet-san-pham.js"></script>
    <script src="./js/pages/san-pham.js"></script>
    <script src="./js/pages/dang-nhap-dang-ky.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./components/components.js"></script>
</body>

</html>
